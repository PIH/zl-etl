name: Verify PRs

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 8
          cache: 'maven'
      - name: Build with Maven
        run: mvn clean verify --batch-mode --file pom.xml
      # The image CI publishes from target/docker (not pushed here).
      - name: Build the Docker image
        run: docker build target/docker
