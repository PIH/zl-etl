type: "job-pipeline"
description: "Refresh HIV Data"
configuration:
  jobs:
    - type: "iterating-job"
      configuration:
        iterations:
          - siteName: "hiv"
            partitionNum: "8"
        jobTemplate:
          path: "load-common-data-from-openmrs.yml"
    - path: "force-site-for-hiv-server.yml"
