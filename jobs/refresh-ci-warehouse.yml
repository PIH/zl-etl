type: "job-pipeline"
description: "Refreshing ZL CI data"
configuration:
  jobs:
    - type: "iterating-job"
      configuration:
        iterations:
          - siteName: "zlci"
            partitionNum: "1"
        jobTemplate:
          path: "load-common-data-from-openmrs.yml"
    - path: "refresh-derived-tables.yml"
